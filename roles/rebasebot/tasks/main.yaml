- name: Validate rebasebot variables
  ansible.builtin.assert:
    that:
      - "':' in rebasebot_source"
      - "':' in rebasebot_dest"
      - "':' in rebasebot_rebase"
      - rebasebot_github_app.app_id is defined
      - rebasebot_github_app.app_key is defined
    fail_msg: >-
      rebasebot_source, rebasebot_dest and rebasebot_rebase must be
      org/repo:branch (set rebasebot_upstream_project or rebasebot_source),
      and rebasebot_github_app must provide app_id and app_key.
    quiet: true
  no_log: true

# NOTE: Upstream deletes branches when a release reaches end of life (only
#       an <release>-eol tag remains), so there is nothing left to sync.
- name: Check that the upstream branch exists
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --exit-code
      - --heads
      - "https://github.com/{{ rebasebot_source.split(':')[0] }}"
      - "{{ rebasebot_source.split(':', 1)[1] }}"
  register: _rebasebot_source_branch
  changed_when: false
  failed_when: _rebasebot_source_branch.rc not in [0, 2]

- name: Report missing upstream branch
  when: _rebasebot_source_branch.rc == 2
  ansible.builtin.debug:
    msg: >-
      {{ rebasebot_source }} does not exist (end of life upstream); there is
      nothing to sync.

- name: Stop when the upstream branch does not exist
  when:
    - _rebasebot_source_branch.rc == 2
    - not rebasebot_fail_on_missing_source | bool
  ansible.builtin.meta: end_host

- name: Fail when the upstream branch does not exist
  when: _rebasebot_source_branch.rc == 2
  ansible.builtin.fail:
    msg: "{{ rebasebot_source }} does not exist."

- name: Create rebasebot working directory
  ansible.builtin.command:
    cmd: git init --quiet {{ rebasebot_workdir }}
    creates: "{{ rebasebot_workdir }}/.git"

# NOTE: rebasebot rewrites local branches, so it cannot work inside the Zuul
#       checkout itself; borrow its objects instead so only new objects are
#       fetched from GitHub.
- name: Borrow objects from the Zuul checkout of the destination repository
  vars:
    _rebasebot_dest_project: "github.com/{{ rebasebot_dest.split(':')[0] }}"
  when: _rebasebot_dest_project in zuul.projects
  ansible.builtin.copy:
    content: "{{ ansible_user_dir }}/{{ zuul.projects[_rebasebot_dest_project].src_dir }}/.git/objects\n"
    dest: "{{ rebasebot_workdir }}/.git/objects/info/alternates"
    mode: "0644"

- name: Run rebasebot
  block:
    - name: Write GitHub App private key
      ansible.builtin.copy:
        content: "{{ rebasebot_github_app.app_key }}"
        dest: "{{ rebasebot_key_file }}"
        mode: "0600"
      no_log: true

    - name: Run rebasebot
      ansible.builtin.command:
        argv: >-
          {{
            [rebasebot_executable,
             '--source', 'https://github.com/' ~ rebasebot_source,
             '--dest', rebasebot_dest,
             '--rebase', rebasebot_rebase,
             '--github-app-id', rebasebot_github_app.app_id | string,
             '--github-app-key', rebasebot_key_file,
             '--github-cloner-id', rebasebot_github_app.app_id | string,
             '--github-cloner-key', rebasebot_key_file,
             '--git-username', rebasebot_git_username,
             '--git-email', rebasebot_git_email,
             '--tag-policy', rebasebot_tag_policy,
             '--working-dir', rebasebot_workdir]
            + (['--dry-run'] if rebasebot_dry_run | bool else [])
            + rebasebot_extra_args
          }}
      changed_when: true
  always:
    - name: Remove GitHub App private key
      ansible.builtin.file:
        path: "{{ rebasebot_key_file }}"
        state: absent
